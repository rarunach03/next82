name: deploy site

# The site lives at https://next82.vercel.app (Vercel builds web/ on every push to
# main). GitHub Pages (https://rarunach03.github.io/next82/) now only redirects
# there, keeping the path, so old links still work: every route serves the same
# small redirect page (404.html covers player pages and anything else).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp pages-redirect/index.html pages-redirect/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
