<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Next82 has moved</title>
    <link rel="canonical" href="https://next82.vercel.app/" />
    <meta name="robots" content="noindex" />
    <!-- Without JavaScript: go to the home page. -->
    <meta http-equiv="refresh" content="0; url=https://next82.vercel.app/" />
    <script>
      // Keep the page: /next82/player/203999?x#y -> https://next82.vercel.app/player/203999?x#y
      var path = location.pathname.replace(/^\/next82/, '') || '/'
      location.replace('https://next82.vercel.app' + path + location.search + location.hash)
    </script>
    <style>
      body { background: #0a0c10; color: #f2f4f7; font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 48px 16px; }
      a { color: #ff7a1a; }
    </style>
  </head>
  <body>
    <p>Next82 has moved to <a href="https://next82.vercel.app/">next82.vercel.app</a>.</p>
  </body>
</html>
